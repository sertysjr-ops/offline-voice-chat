<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes Voice — Offline</title>
<style>
  :root {
    --bg: #0b0d12; --panel: #12151d; --line: #232838;
    --txt: #e8ecf4; --dim: #8a93a8; --acc: #7c5cff; --acc2: #22d3ee;
    --user: #1d2433; --bot: #161a26;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--txt);
    font: 15px/1.55 -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    height: 100vh; display: flex; flex-direction: column; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #4ade80;
    box-shadow: 0 0 8px #4ade80; }
  .dot.off { background: #f87171; box-shadow: 0 0 8px #f87171; }
  header h1 { font-size: 16px; font-weight: 650; letter-spacing: .2px; }
  header .sub { color: var(--dim); font-size: 12px; margin-left: auto; }
  #log { flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 14px;
    white-space: pre-wrap; word-break: break-word; }
  .msg.you { align-self: flex-end; background: var(--user);
    border: 1px solid var(--line); border-bottom-right-radius: 4px; }
  .msg.hermes { align-self: flex-start; background: var(--bot);
    border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg .who { font-size: 11px; color: var(--acc2); margin-bottom: 4px;
    text-transform: uppercase; letter-spacing: .8px; }
  .msg.you .who { color: var(--acc); text-align: right; }
  .msg audio { width: 100%; margin-top: 8px; height: 36px; }
  .status { text-align: center; color: var(--dim); font-size: 13px; padding: 4px; }
  #bar { border-top: 1px solid var(--line); padding: 14px 20px;
    display: flex; gap: 10px; align-items: center; }
  #mic { width: 52px; height: 52px; border-radius: 50%; border: none;
    background: var(--acc); color: #fff; font-size: 22px; cursor: pointer;
    transition: transform .1s, background .2s; flex-shrink: 0; }
  #mic:hover { transform: scale(1.06); }
  #mic.rec { background: #ef4444; animation: pulse 1.1s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 12px rgba(239,68,68,.15); } }
  #text { flex: 1; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; color: var(--txt); padding: 12px 14px; font-size: 15px; }
  #text:focus { outline: 1px solid var(--acc); }
  #send { background: var(--panel); border: 1px solid var(--line); color: var(--txt);
    border-radius: 12px; padding: 12px 18px; cursor: pointer; }
  #send:hover { border-color: var(--acc); }
  #meter { height: 4px; background: var(--line); border-radius: 2px;
    overflow: hidden; }
  #meter i { display: block; height: 100%; width: 0%; background: var(--acc2);
    transition: width 60ms linear; }
</style>
</head>
<body>
<header>
  <span class="dot off" id="dot"></span>
  <h1>Hermes Voice</h1>
  <button id="newchat" title="New conversation" style="margin-left:12px;background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer;">⟲ new chat</button>
  <button id="hf" title="Hands-free: continuously listen, answer only after 'hey hermes'" style="background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer;">🖐 hands-free: off</button>
  <button id="al" title="Always-on: mic watches for the wake word only (cheap KWS, no STT). Say 'hey hermes' and the recorder opens by itself" style="background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer;">👂 always-on: off</button>
  <label style="margin-left:10px;display:flex;align-items:center;gap:6px;color:var(--dim);font-size:12px;">
    🎚 <input type="range" id="speed" min="0.5" max="2.5" step="0.1" value="1" style="width:80px;accent-color:var(--acc2);">
    <span id="speedVal">1.0×</span>
  </label>
  <select id="voiceSel" title="Voice" style="margin-left:6px;background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:4px 8px;font-size:12px;"></select>
  <span class="sub" id="sub">offline · whisper + ollama + piper</span>
</header>
<div id="log"></div>
<div id="meter"><i id="meterFill"></i></div>
<div class="status" id="status">hold SPACE to talk, tap the mic, or type below</div>
<div id="bar">
  <button id="mic" title="Talk (or hold SPACE)">🎙</button>
  <input id="text" placeholder="…or type and hit enter" autocomplete="off">
  <button id="send">Send</button>
</div>

<script>
const log = document.getElementById('log');
const statusEl = document.getElementById('status');
const micBtn = document.getElementById('mic');
const textEl = document.getElementById('text');
const dot = document.getElementById('dot');
const meterFill = document.getElementById('meterFill');
const hfBtn = document.getElementById('hf');
const speedEl = document.getElementById('speed');
const speedVal = document.getElementById('speedVal');
const voiceSel = document.getElementById('voiceSel');
let handsFree = false;

/* Voice prefs ride along with every request; the server saves them into
 * the session profile, so a reload keeps the last pick. */
function voicePayload() {
  return { speed: parseFloat(speedEl.value), voice: voiceSel.value || 'lessac' };
}
function showVoice(v) {
  if (!v) return;
  speedVal.textContent = Number(v.speed).toFixed(1) + '×';
  if (document.activeElement !== speedEl) speedEl.value = v.speed;
  if (voiceSel.querySelector(`option[value="${v.voice}"]`)) voiceSel.value = v.voice;
  const label = v.voice + (v.voice === 'libritts' ? ` #${v.speaker}` : '');
  document.getElementById('sub').textContent =
    `offline · whisper + ollama + piper · ${label} · ${Number(v.speed).toFixed(1)}×`;
}
speedEl.addEventListener('input', () => { speedVal.textContent = Number(speedEl.value).toFixed(1) + '×'; });

async function loadVoices() {
  try {
    const r = await fetch('/api/voices');
    const d = await r.json();
    voiceSel.innerHTML = '';
    for (const v of d.voices ?? []) {
      const o = document.createElement('option');
      o.value = v.name; o.textContent = v.name;
      voiceSel.appendChild(o);
      for (const [preset, sid] of Object.entries(v.presets ?? {})) {
        const p = document.createElement('option');
        p.value = `${v.name}:${preset}`;
        p.textContent = `${v.name} · ${preset}`;
        voiceSel.appendChild(p);
      }
    }
  } catch {}
}
loadVoices();

hfBtn.addEventListener('click', () => {
  handsFree = !handsFree;
  hfBtn.textContent = `🖐 hands-free: ${handsFree ? 'ON — say "hey hermes"' : 'off'}`;
  hfBtn.style.color = handsFree ? '#22d3ee' : 'var(--dim)';
  hfBtn.style.borderColor = handsFree ? '#22d3ee' : 'var(--line)';
  if (handsFree && alwaysOn) setAlwaysOn(false);   // one mic loop at a time
  if (!handsFree && recording) stopRec();
  setStatus(handsFree
    ? 'hands-free on — keep the mic open, say "hey hermes, …"'
    : 'hands-free off — hold SPACE to talk, or type below');
});
// Server-side conversation memory: one session id for this browser tab,
// survives reloads via sessionStorage. The server keeps the history —
// the client just renders it.
let sessionId = sessionStorage.getItem('vc-session');
if (!sessionId) {
  sessionId = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());
  sessionStorage.setItem('vc-session', sessionId);
}
let busy = false;

async function newChat() {
  try {
    await fetch('/api/clear', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session: sessionId }),
    });
  } catch {}
  log.innerHTML = '';
  setStatus('new conversation — hold SPACE to talk, or type below');
}

/* ---------- streaming TTS playback (NDJSON chunks → AudioContext) ---------- */
let actx = null, nextPlayTime = 0;
/* Barge-in: every scheduled source is tracked so a wake word during
 * playback can kill the queue instantly. liveAudioEls covers the buffered
 * JSON path (<audio autoplay> bubbles). */
const liveSources = new Set();
const liveAudioEls = new Set();
function stopPlayback() {
  for (const s of liveSources) { try { s.onended = null; s.stop(); } catch {} }
  liveSources.clear();
  for (const a of liveAudioEls) { try { a.pause(); } catch {} }
  liveAudioEls.clear();
  nextPlayTime = 0;
}
function getCtx() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function b64ToBytes(b64) {
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}
async function playChunk(b64) {
  const ctx = getCtx();
  const bytes = b64ToBytes(b64);
  const buf = await ctx.decodeAudioData(bytes.buffer.slice(0));
  scheduleBuf(ctx, buf);
}
function scheduleBuf(ctx, buf) {
  const src = ctx.createBufferSource();
  src.buffer = buf;
  src.connect(ctx.destination);
  liveSources.add(src);                    // barge-in can kill queued audio
  src.onended = () => liveSources.delete(src);
  const now = ctx.currentTime;
  if (nextPlayTime < now) nextPlayTime = now + 0.06; // tiny gap before first chunk
  src.start(nextPlayTime);
  nextPlayTime += buf.duration;
}
/* NDJSON v3: raw s16le fragments at pcmRate (from meta.pcm). No WAV
   container, no decodeAudioData — a fragment is playable the moment its
   line lands, so audio starts mid-synthesis. */
let pcmRate = 0;
function playPcmFrag(b64) {
  const ctx = getCtx();
  const bytes = b64ToBytes(b64);
  const i16 = new Int16Array(bytes.buffer, bytes.byteOffset, bytes.length >> 1);
  const f32 = new Float32Array(i16.length);
  for (let i = 0; i < i16.length; i++) f32[i] = i16[i] / 32768;
  const buf = ctx.createBuffer(1, f32.length, pcmRate || 22050);
  buf.getChannelData(0).set(f32);
  scheduleBuf(ctx, buf);
}

/* Barge-in plumbing: the in-flight streaming request gets an
 * AbortController so a wake word mid-reply can cut the stream AND the
 * playback queue, then open the recorder for the next command. bargeFlag
 * tells the aborted call site's catch block "this was on purpose". */
let activeAbort = null, bargeFlag = false;
function bargeIn() {
  bargeFlag = true;
  stopPlayback();
  if (activeAbort) { try { activeAbort.abort(); } catch {} }
  // The aborted request's finally{} would normally clear busy — but it
  // runs asynchronously, and startRec() early-returns while busy. Force
  // the reset NOW so the recorder opens immediately.
  busy = false; micBtn.disabled = false;
}

/**
 * POST with stream:"pcm". The server either answers plain JSON (wake-word
 * gate / errors / legacy) or streams NDJSON: meta (voice, transcript?,
 * pcm {rate}) → per sentence sbegin (text) → pcm* (s16le fragments,
 * playable on arrival) → send → done (full reply + counts).
 * handlers: {meta, sbegin, pcm, send, chunk, done} — awaited in arrival
 * order. chunk is the v2 WAV fallback for older servers. signal wires
 * the request into barge-in aborts.
 */
async function requestMaybeStream(url, payload, handlers, signal) {
  const r = await fetch(url, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ...payload, stream: 'pcm' }),
    signal,
  });
  const ctype = r.headers.get('content-type') || '';
  if (!ctype.includes('ndjson')) {
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    return d; // caller handles JSON (e.g. wakeWordHit gate)
  }
  const reader = r.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf('\n')) >= 0) {
      const line = buf.slice(0, i); buf = buf.slice(i + 1);
      if (!line.trim()) continue;
      const msg = JSON.parse(line);
      if (msg.type === 'error') throw new Error(msg.message);
      if (msg.type === 'meta' && msg.pcm) pcmRate = msg.pcm.rate;
      await handlers[msg.type]?.(msg);
    }
  }
  return null;
}

/* Handlers shared by all three streaming call sites: sbegin grows the
   reply bubble, pcm fragments play the moment they land, chunk is the
   v2 (whole-sentence WAV) fallback. */
function pcmHandlers(getBubble) {
  const grow = (text) => {
    const b = getBubble();
    if (b && text) {
      b.textNode.textContent += (b.textNode.textContent ? ' ' : '') + text;
      log.scrollTop = log.scrollHeight;
    }
  };
  return {
    sbegin: (m) => { grow(m.text); setStatus(`speaking… (sentence ${m.i + 1})`); },
    pcm: (m) => { playPcmFrag(m.data); watchDuringPlayback(); },
    chunk: async (m) => { grow(m.text); setStatus(`speaking… (sentence ${m.i + 1})`); await playChunk(m.audio); watchDuringPlayback(); },
  };
}

/* Barge-in: in always-on mode the wake watch keeps running WHILE Hermes
 * speaks, so "hey hermes" mid-reply cuts playback and opens the mic.
 * (The watch's mic stream is separate from playback — echoCancellation
 * keeps it from triggering on Hermes's own voice.) */
function watchDuringPlayback() {
  if (alwaysOn && !wTimer && !recording) startWatch();
}

/* ---------- chat rendering ---------- */
function addMsg(who, text, audioB64) {
  const div = document.createElement('div');
  div.className = 'msg ' + (who === 'you' ? 'you' : 'hermes');
  const w = document.createElement('div');
  w.className = 'who'; w.textContent = who === 'you' ? 'you' : 'hermes';
  div.appendChild(w);
  const textNode = document.createTextNode(text);
  div.appendChild(textNode);
  if (audioB64) {
    const bytes = atob(audioB64);
    const arr = new Uint8Array(bytes.length);
    for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
    const a = document.createElement('audio');
    a.controls = true; a.autoplay = true;
    a.src = URL.createObjectURL(new Blob([arr], { type: 'audio/wav' }));
    liveAudioEls.add(a);                 // barge-in can pause these too
    a.onended = () => liveAudioEls.delete(a);
    div.appendChild(a);
  }
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return { div, textNode }; // streaming handlers grow the text node live
}

function setStatus(t) { statusEl.textContent = t; }

async function ping() {
  try {
    const r = await fetch('/api/health');
    const d = await r.json();
    dot.className = 'dot' + (d.ok ? '' : ' off');
  } catch { dot.className = 'dot off'; }
}
ping(); setInterval(ping, 10000);

/* ---------- WAV encoding (16kHz mono PCM16) ---------- */
function encodeWav(samples) {
  const buf = new ArrayBuffer(44 + samples.length * 2);
  const v = new DataView(buf);
  const wstr = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  wstr(0, 'RIFF'); v.setUint32(4, 36 + samples.length * 2, true);
  wstr(8, 'WAVE'); wstr(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, 16000, true); v.setUint32(28, 32000, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  wstr(36, 'data'); v.setUint32(40, samples.length * 2, true);
  let o = 44;
  for (let i = 0; i < samples.length; i++, o += 2) {
    const s = Math.max(-1, Math.min(1, samples[i]));
    v.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }
  return new Uint8Array(buf);
}

function b64encode(bytes) {
  let bin = '';
  const CH = 0x8000;
  for (let i = 0; i < bytes.length; i += CH)
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  return btoa(bin);
}

/* ---------- recording with browser-side VAD ---------- */
let ctx, stream, node, recording = false;
let recChunks = [];          // Float32 chunks at the AudioContext sample rate
let silentSince = null, recStart = 0;
let pttActive = false;       // push-to-talk: hold SPACE, release to send
const MAX_MS = 15000, SILENCE_MS = 1400, THRESH = 0.015;

/* Live partial STT: while recording, we ship 16k PCM deltas to
 * /api/stt/partial every 1.5s. The server re-decodes the growing buffer,
 * so by the time you stop talking the transcript is already decoded —
 * stopRec goes straight to the LLM with text and skips the STT wait. */
let recStreamId = null, partialSent = 0, partialTimer = null;
let kwsAvailable = true;  // flips off on 503 so we stop paying the roundtrip

function pcm16Bytes(samples) {
  const buf = new ArrayBuffer(samples.length * 2);
  const v = new DataView(buf);
  for (let i = 0; i < samples.length; i++) {
    const s = Math.max(-1, Math.min(1, samples[i]));
    v.setInt16(i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }
  return new Uint8Array(buf);
}

/* Merge + resample everything captured so far → Float32Array @16k. */
function currentPcm16k() {
  const inputRate = ctx.sampleRate;
  const total = recChunks.reduce((n, c) => n + c.length, 0);
  const merged = new Float32Array(total);
  let off = 0;
  for (const c of recChunks) { merged.set(c, off); off += c.length; }
  const ratio = 16000 / inputRate;
  const outLen = Math.floor(total * ratio);
  const out = new Float32Array(outLen);
  for (let i = 0; i < outLen; i++) {
    const pos = i / ratio, i0 = Math.floor(pos), i1 = Math.min(i0 + 1, total - 1);
    out[i] = merged[i0] + (merged[i1] - merged[i0]) * (pos - i0);
  }
  return out;
}

async function sendPartial(final = false, samples = null) {
  if (!recStreamId) return null;
  // `samples` lets stopRec pass the buffer captured BEFORE teardown —
  // recChunks is already cleared by then, so recomputing would be empty.
  const out = samples || currentPcm16k();
  const from = partialSent;
  if (!final && out.length - from < 16000 * 0.8) return null; // need ≥0.8s new
  partialSent = out.length;
  const delta = pcm16Bytes(out.subarray(from));
  const r = await fetch('/api/stt/partial', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ stream: recStreamId, pcm: b64encode(delta), final }),
  });
  const d = await r.json();
  if (d.error) throw new Error(d.error);
  if (!final && d.partial && recording) setStatus('hearing: “' + d.partial + '”');
  return d;
}

/* ---------- always-on wake watch ----------
 * The mic listens ONLY for the wake word: a rolling 2s window ships to
 * /api/wake (sherpa KWS, ~0.1s, no STT, no LLM) every 1.2s. On a hit the
 * recorder opens by itself and the command comes as the NEXT utterance —
 * so that turn skips BOTH wake gates (KWS pre-gate + /api/ask transcript
 * gate) via skipGateOnce. Mutually exclusive with hands-free. */
const alBtn = document.getElementById('al');
let alwaysOn = false;
let wStream = null, wCtx = null, wNode = null, wTimer = null, wChunks = [];
let wInFlight = false, skipGateOnce = false;
const WATCH_WINDOW_S = 2.0, WATCH_POLL_MS = 1200;

alBtn.addEventListener('click', () => setAlwaysOn(!alwaysOn));

async function setAlwaysOn(on) {
  alwaysOn = on;
  alBtn.textContent = `👂 always-on: ${on ? 'ON — say "hey hermes"' : 'off'}`;
  alBtn.style.color = on ? '#4ade80' : 'var(--dim)';
  alBtn.style.borderColor = on ? '#4ade80' : 'var(--line)';
  if (on) {
    if (handsFree) hfBtn.click();          // one mic loop at a time
    if (recording) stopRec();
    startWatch();
  } else {
    stopWatch();
    setStatus('hold SPACE to talk, or type below');
  }
}

async function startWatch() {
  if (wTimer || !alwaysOn) return;
  try {
    // echoCancellation matters for barge-in: the watch keeps listening
    // while Hermes speaks, and we don't want his own voice (speakers →
    // mic) false-triggering the wake word.
    wStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true },
    });
  } catch {
    setStatus('⚠ mic denied — always-on needs the mic');
    setAlwaysOn(false);
    return;
  }
  wCtx = new (window.AudioContext || window.webkitAudioContext)();
  const src = wCtx.createMediaStreamSource(wStream);
  wNode = wCtx.createScriptProcessor(4096, 1, 1);
  wChunks = [];
  const cap = Math.ceil(wCtx.sampleRate * (WATCH_WINDOW_S + 0.5));
  let wLen = 0;
  wNode.onaudioprocess = (e) => {
    const d = new Float32Array(e.inputBuffer.getChannelData(0));
    wChunks.push(d); wLen += d.length;
    while (wLen > cap) wLen -= wChunks.shift().length;
    let sum = 0;
    for (let i = 0; i < d.length; i += 8) sum += d[i] * d[i];
    meterFill.style.width = Math.min(100, Math.sqrt(sum / (d.length / 8)) * 400) + '%';
  };
  src.connect(wNode); wNode.connect(wCtx.destination);
  setStatus('👂 watching for “hey hermes”…');
  wTimer = setInterval(pollWake, WATCH_POLL_MS);
}

function stopWatch() {
  if (wTimer) { clearInterval(wTimer); wTimer = null; }
  if (wNode) { wNode.disconnect(); wNode = null; }
  if (wCtx) { wCtx.close(); wCtx = null; }
  if (wStream) { wStream.getTracks().forEach(t => t.stop()); wStream = null; }
  wChunks = [];
  meterFill.style.width = '0%';
}

function maybeResumeWatch(delayMs = 800) {
  if (!alwaysOn) return;
  setTimeout(() => { if (alwaysOn && !busy && !recording) startWatch(); }, delayMs);
}

async function pollWake() {
  // No `busy` guard on purpose: during playback the watch IS the barge-in
  // detector — a wake word mid-reply must be heard, not skipped.
  if (!alwaysOn || wInFlight || recording || !wCtx) return;
  const inputRate = wCtx.sampleRate;
  const total = wChunks.reduce((n, c) => n + c.length, 0);
  if (total < inputRate * 0.8) return;          // not enough audio yet
  const merged = new Float32Array(total);
  let off = 0;
  for (const c of wChunks) { merged.set(c, off); off += c.length; }
  // resample to 16k (same linear interp as currentPcm16k)
  const ratio = 16000 / inputRate;
  const outLen = Math.floor(total * ratio);
  const out = new Float32Array(outLen);
  for (let i = 0; i < outLen; i++) {
    const pos = i / ratio, i0 = Math.floor(pos), i1 = Math.min(i0 + 1, total - 1);
    out[i] = merged[i0] + (merged[i1] - merged[i0]) * (pos - i0);
  }
  wInFlight = true;
  try {
    const r = await fetch('/api/wake', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ audio: b64encode(encodeWav(out)) }),
    });
    const d = await r.json();
    if (d.error) {                       // 503: KWS model missing server-side
      setStatus('⚠ KWS model missing on the server — always-on turned off');
      setAlwaysOn(false);
      return;
    }
    if (d.awake) {
      skipGateOnce = true;               // command comes as the next utterance
      stopWatch();
      if (busy || liveSources.size || liveAudioEls.size) {
        bargeIn();                       // cut the reply + playback queue
        setStatus('⚡ interrupted — say your command');
      } else {
        setStatus('👂 wake word heard — say your command');
      }
      startRec();
    }
  } catch {} finally { wInFlight = false; }
}

micBtn.addEventListener('click', () => {
  if (!recording && alwaysOn) stopWatch();  // manual turn pauses the watch
  recording ? stopRec() : startRec();
});

/* Push-to-talk: hold SPACE to record, release to send. While held, the
 * silence auto-stop is disabled — you decide when the utterance ends.
 * Ignored while hands-free is driving the mic (it has its own loop). */
window.addEventListener('keydown', (e) => {
  if (e.code !== 'Space' || e.repeat) return;
  if (e.target === textEl) return;            // never steal typing space
  e.preventDefault();                          // no page scroll / button re-click
  if (pttActive || busy || recording || handsFree || alwaysOn) return;
  pttActive = true;
  startRec();
});
window.addEventListener('keyup', (e) => {
  if (e.code !== 'Space' || !pttActive) return;
  pttActive = false;
  if (recording) stopRec();
});
// If the window loses focus mid-hold (alt-tab etc.), release the PTT key.
window.addEventListener('blur', () => {
  if (!pttActive) return;
  pttActive = false;
  if (recording) stopRec();
});

async function startRec() {
  if (busy) return;
  stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  const src = ctx.createMediaStreamSource(stream);
  node = ctx.createScriptProcessor(4096, 1, 1);
  recChunks = [];
  silentSince = null;
  recStart = performance.now();
  recStreamId = crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random();
  partialSent = 0;
  partialTimer = setInterval(() => { sendPartial(false).catch(() => {}); }, 1500);

  node.onaudioprocess = (e) => {
    const d = e.inputBuffer.getChannelData(0);
    recChunks.push(new Float32Array(d));
    let sum = 0;
    for (let i = 0; i < d.length; i += 4) sum += d[i] * d[i];
    const rms = Math.sqrt(sum / (d.length / 4));
    meterFill.style.width = Math.min(100, rms * 400) + '%';
    const now = performance.now();
    if (now - recStart > MAX_MS) { stopRec(); return; }
    // In PTT mode the user ends the utterance with the key — no silence stop.
    if (!pttActive && rms < THRESH) {
      if (silentSince === null) silentSince = now;
      else if (now - silentSince > SILENCE_MS && now - recStart > 800) stopRec();
    } else silentSince = null;
  };
  src.connect(node); node.connect(ctx.destination);
  recording = true;
  micBtn.classList.add('rec');
  setStatus(pttActive ? 'recording… release SPACE to send' : 'listening… (auto-stops on silence)');
}

async function stopRec() {
  if (!recording) return;
  recording = false;
  clearInterval(partialTimer); partialTimer = null;
  micBtn.classList.remove('rec');
  meterFill.style.width = '0%';
  // always-on: this turn was opened BY the wake word, so both gates skip
  const skipGate = skipGateOnce;
  skipGateOnce = false;
  const inputRate = ctx.sampleRate;
  const total = recChunks.reduce((n, c) => n + c.length, 0);
  const out = currentPcm16k();   // 16k Float32, before we tear down ctx
  recChunks = [];
  node.disconnect(); ctx.close();
  stream.getTracks().forEach(t => t.stop());
  const secs = total / inputRate;
  if (secs < 0.4) {
    setStatus('too short — try again');
    // still free the server-side buffer for this stream
    try { await sendPartial(true, out); } catch {}
    recStreamId = null;
    maybeResumeWatch(1200);
    return;
  }
  setStatus(`heard ${secs.toFixed(1)}s — thinking…`);
  // Fast path: the final partial decode IS the full-utterance decode
  // (the server kept appending our deltas), so we get the transcript
  // back immediately and go straight to the LLM — no STT wait.
  try {
    // Hands-free only: audio-native KWS pre-gate (sherpa, ~0.1s) runs
    // CONCURRENTLY with the final decode. A reject here never shows a
    // bubble and never touches the LLM — the server-side transcript gate
    // in /api/ask stays on as the second layer for KWS false-positives.
    // Skipped when the wake word itself opened this recording (always-on).
    const wakeP = (handsFree && kwsAvailable && !skipGate)
      ? fetch('/api/wake', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ audio: b64encode(encodeWav(out)) }),
        }).then(r => r.json()).catch(() => null)
      : Promise.resolve(null);
    const [wake, d] = await Promise.all([wakeP, sendPartial(true, out)]);
    recStreamId = null;
    if (wake && wake.error) kwsAvailable = false; // model missing — stop asking
    if (wake && wake.awake === false) {
      setStatus('heard something — not for me (say “hey hermes” first)');
      if (handsFree) setTimeout(() => { if (handsFree && !busy && !recording) startRec(); }, 900);
      maybeResumeWatch(900);
      return;
    }
    const transcript = (d && d.transcript || '').trim();
    if (!transcript) {
      setStatus("didn't catch that — try again");
      if (handsFree) setTimeout(() => { if (handsFree && !busy && !recording) startRec(); }, 1200);
      maybeResumeWatch(1200);
      return;
    }
    askTranscript(transcript, skipGate);
    return;
  } catch {
    // older server without /api/stt/partial — fall back to the WAV path
    recStreamId = null;
    sendAudio(b64encode(encodeWav(out)));
  }
}

/* We already have the transcript (live partial STT) — skip STT entirely
 * and run the same streaming LLM→TTS flow as typed input. skipGate is set
 * when always-on's KWS already verified this turn's wake word. */
async function askTranscript(transcript, skipGate = false) {
  busy = true; micBtn.disabled = true;
  let ok = false;
  nextPlayTime = 0;
  let bubble = null;
  addMsg('you', transcript);
  const ac = new AbortController(); activeAbort = ac;   // barge-in handle
  try {
    const json = await requestMaybeStream('/api/ask',
      { text: transcript, session: sessionId, handsFree: handsFree && !skipGate, ...voicePayload() },
      {
        meta: (m) => { bubble = addMsg('hermes', ''); showVoice(m.voice); },
        ...pcmHandlers(() => bubble),
        done: (m) => {
          if (bubble && m.reply) bubble.textNode.textContent = m.reply;
          showVoice(m.voice);
        },
      }, ac.signal);
    if (json) {
      if (json.wakeWordHit === false) {
        ok = true;
        setStatus(`heard “${json.transcript}” — say “hey hermes” first`);
        return;
      }
      if (json.reply) addMsg('hermes', json.reply, json.audio);
      showVoice(json.voice);
    }
    setStatus(handsFree ? 'listening… (hands-free)' : 'hold SPACE to talk, or type below');
    ok = true;
  } catch (err) {
    if (bargeFlag) { bargeFlag = false; ok = true; }   // deliberate interrupt
    else setStatus('⚠ ' + err.message);
  } finally {
    if (activeAbort === ac) activeAbort = null;
    busy = false; micBtn.disabled = false;
    if (handsFree && ok) setTimeout(() => { if (handsFree && !busy && !recording) startRec(); }, 1200);
    if (ok) maybeResumeWatch(1200);
    else maybeResumeWatch(1500); // error path — still resume so the mic isn't dead
  }
}

async function sendAudio(b64) {
  busy = true; micBtn.disabled = true;
  let ok = false;
  nextPlayTime = 0;
  let bubble = null, heard = 0;
  const ac = new AbortController(); activeAbort = ac;   // barge-in handle
  try {
    const json = await requestMaybeStream('/api/talk',
      { audio: b64, session: sessionId, handsFree, ...voicePayload() },
      {
        meta: (m) => {
          addMsg('you', m.transcript);
          bubble = addMsg('hermes', ''); // grows live as chunks arrive
          showVoice(m.voice);
        },
        ...pcmHandlers(() => bubble),
        done: (m) => {
          if (bubble && m.reply) bubble.textNode.textContent = m.reply;
          showVoice(m.voice);
        },
      }, ac.signal);
    if (json) {
      if (json.wakeWordHit === false) {
        // heard something, but not for us — stay quiet, don't bubble
        ok = true;
        setStatus(`heard “${json.transcript}” — say “hey hermes” first`);
        return;
      }
      if (json.reply) addMsg('hermes', json.reply, json.audio);
      showVoice(json.voice);
    }
    setStatus(handsFree ? 'listening… (hands-free)' : 'hold SPACE to talk, or type below');
    ok = true;
  } catch (err) {
    if (bargeFlag) { bargeFlag = false; ok = true; }   // deliberate interrupt
    else setStatus('⚠ ' + err.message);
  } finally {
    if (activeAbort === ac) activeAbort = null;
    busy = false; micBtn.disabled = false;
    if (handsFree && ok) setTimeout(() => { if (handsFree && !busy && !recording) startRec(); }, 1200);
    if (ok) maybeResumeWatch(1200);
    else maybeResumeWatch(1500);
  }
}

/* ---------- text fallback ---------- */
async function sendText() {
  const t = textEl.value.trim();
  if (!t || busy) return;
  textEl.value = '';
  busy = true;
  addMsg('you', t);
  setStatus('thinking…');
  nextPlayTime = 0;
  let heardChunk = false;
  let bubble = null;
  const ac = new AbortController(); activeAbort = ac;   // barge-in handle
  try {
    const json = await requestMaybeStream('/api/ask', { text: t, session: sessionId, ...voicePayload() }, {
      meta: (m) => { bubble = addMsg('hermes', ''); showVoice(m.voice); },
      ...pcmHandlers(() => { heardChunk = true; return bubble; }),
      done: (m) => {
        if (bubble && m.reply) bubble.textNode.textContent = m.reply;
        showVoice(m.voice);
      },
    }, ac.signal);
    if (json && json.reply) { addMsg('hermes', json.reply, json.audio); showVoice(json.voice); }
    if (!heardChunk && !json) setStatus('no audio came back — check the server log');
    else setStatus('hold SPACE to talk, or type below');
  } catch (err) {
    if (!bargeFlag) setStatus('⚠ ' + err.message);      // barge = deliberate
    bargeFlag = false;
  } finally {
    if (activeAbort === ac) activeAbort = null;
    busy = false;
  }
}
document.getElementById('send').addEventListener('click', sendText);
document.getElementById('newchat').addEventListener('click', newChat);
textEl.addEventListener('keydown', e => { if (e.key === 'Enter') sendText(); });
</script>
