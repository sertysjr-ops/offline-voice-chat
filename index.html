<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes Voice — Offline</title>
<style>
  :root {
    --bg: #0b0d12; --panel: #12151d; --line: #232838;
    --txt: #e8ecf4; --dim: #8a93a8; --acc: #7c5cff; --acc2: #22d3ee;
    --user: #1d2433; --bot: #161a26;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--txt);
    font: 15px/1.55 -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    height: 100vh; display: flex; flex-direction: column; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #4ade80;
    box-shadow: 0 0 8px #4ade80; }
  .dot.off { background: #f87171; box-shadow: 0 0 8px #f87171; }
  header h1 { font-size: 16px; font-weight: 650; letter-spacing: .2px; }
  header .sub { color: var(--dim); font-size: 12px; margin-left: auto; }
  #log { flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 14px;
    white-space: pre-wrap; word-break: break-word; }
  .msg.you { align-self: flex-end; background: var(--user);
    border: 1px solid var(--line); border-bottom-right-radius: 4px; }
  .msg.hermes { align-self: flex-start; background: var(--bot);
    border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg .who { font-size: 11px; color: var(--acc2); margin-bottom: 4px;
    text-transform: uppercase; letter-spacing: .8px; }
  .msg.you .who { color: var(--acc); text-align: right; }
  .msg audio { width: 100%; margin-top: 8px; height: 36px; }
  .status { text-align: center; color: var(--dim); font-size: 13px; padding: 4px; }
  #bar { border-top: 1px solid var(--line); padding: 14px 20px;
    display: flex; gap: 10px; align-items: center; }
  #mic { width: 52px; height: 52px; border-radius: 50%; border: none;
    background: var(--acc); color: #fff; font-size: 22px; cursor: pointer;
    transition: transform .1s, background .2s; flex-shrink: 0; }
  #mic:hover { transform: scale(1.06); }
  #mic.rec { background: #ef4444; animation: pulse 1.1s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 12px rgba(239,68,68,.15); } }
  #text { flex: 1; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; color: var(--txt); padding: 12px 14px; font-size: 15px; }
  #text:focus { outline: 1px solid var(--acc); }
  #send { background: var(--panel); border: 1px solid var(--line); color: var(--txt);
    border-radius: 12px; padding: 12px 18px; cursor: pointer; }
  #send:hover { border-color: var(--acc); }
  #meter { height: 4px; background: var(--line); border-radius: 2px;
    overflow: hidden; }
  #meter i { display: block; height: 100%; width: 0%; background: var(--acc2);
    transition: width 60ms linear; }
</style>
</head>
<body>
<header>
  <span class="dot off" id="dot"></span>
  <h1>Hermes Voice</h1>
  <button id="newchat" title="New conversation" style="margin-left:12px;background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer;">⟲ new chat</button>
  <span class="sub" id="sub">offline · whisper + ollama + piper</span>
</header>
<div id="log"></div>
<div id="meter"><i id="meterFill"></i></div>
<div class="status" id="status">tap the mic or type below</div>
<div id="bar">
  <button id="mic" title="Talk">🎙</button>
  <input id="text" placeholder="…or type and hit enter" autocomplete="off">
  <button id="send">Send</button>
</div>

<script>
const log = document.getElementById('log');
const statusEl = document.getElementById('status');
const micBtn = document.getElementById('mic');
const textEl = document.getElementById('text');
const dot = document.getElementById('dot');
const meterFill = document.getElementById('meterFill');
// Server-side conversation memory: one session id for this browser tab,
// survives reloads via sessionStorage. The server keeps the history —
// the client just renders it.
let sessionId = sessionStorage.getItem('vc-session');
if (!sessionId) {
  sessionId = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());
  sessionStorage.setItem('vc-session', sessionId);
}
let busy = false;

async function newChat() {
  try {
    await fetch('/api/clear', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session: sessionId }),
    });
  } catch {}
  log.innerHTML = '';
  setStatus('new conversation — tap the mic or type below');
}

/* ---------- chat rendering ---------- */
function addMsg(who, text, audioB64) {
  const div = document.createElement('div');
  div.className = 'msg ' + (who === 'you' ? 'you' : 'hermes');
  const w = document.createElement('div');
  w.className = 'who'; w.textContent = who === 'you' ? 'you' : 'hermes';
  div.appendChild(w);
  div.appendChild(document.createTextNode(text));
  if (audioB64) {
    const bytes = atob(audioB64);
    const arr = new Uint8Array(bytes.length);
    for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
    const a = document.createElement('audio');
    a.controls = true; a.autoplay = true;
    a.src = URL.createObjectURL(new Blob([arr], { type: 'audio/wav' }));
    div.appendChild(a);
  }
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function setStatus(t) { statusEl.textContent = t; }

async function ping() {
  try {
    const r = await fetch('/api/health');
    const d = await r.json();
    dot.className = 'dot' + (d.ok ? '' : ' off');
  } catch { dot.className = 'dot off'; }
}
ping(); setInterval(ping, 10000);

/* ---------- WAV encoding (16kHz mono PCM16) ---------- */
function encodeWav(samples) {
  const buf = new ArrayBuffer(44 + samples.length * 2);
  const v = new DataView(buf);
  const wstr = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  wstr(0, 'RIFF'); v.setUint32(4, 36 + samples.length * 2, true);
  wstr(8, 'WAVE'); wstr(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, 16000, true); v.setUint32(28, 32000, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  wstr(36, 'data'); v.setUint32(40, samples.length * 2, true);
  let o = 44;
  for (let i = 0; i < samples.length; i++, o += 2) {
    const s = Math.max(-1, Math.min(1, samples[i]));
    v.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }
  return new Uint8Array(buf);
}

function b64encode(bytes) {
  let bin = '';
  const CH = 0x8000;
  for (let i = 0; i < bytes.length; i += CH)
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  return btoa(bin);
}

/* ---------- recording with browser-side VAD ---------- */
let ctx, stream, node, recording = false;
let recChunks = [];          // Float32 chunks at the AudioContext sample rate
let silentSince = null, recStart = 0;
const MAX_MS = 15000, SILENCE_MS = 1400, THRESH = 0.015;

micBtn.addEventListener('click', () => { recording ? stopRec() : startRec(); });

async function startRec() {
  if (busy) return;
  stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  const src = ctx.createMediaStreamSource(stream);
  node = ctx.createScriptProcessor(4096, 1, 1);
  recChunks = [];
  silentSince = null;
  recStart = performance.now();

  node.onaudioprocess = (e) => {
    const d = e.inputBuffer.getChannelData(0);
    recChunks.push(new Float32Array(d));
    let sum = 0;
    for (let i = 0; i < d.length; i += 4) sum += d[i] * d[i];
    const rms = Math.sqrt(sum / (d.length / 4));
    meterFill.style.width = Math.min(100, rms * 400) + '%';
    const now = performance.now();
    if (now - recStart > MAX_MS) { stopRec(); return; }
    if (rms < THRESH) {
      if (silentSince === null) silentSince = now;
      else if (now - silentSince > SILENCE_MS && now - recStart > 800) stopRec();
    } else silentSince = null;
  };
  src.connect(node); node.connect(ctx.destination);
  recording = true;
  micBtn.classList.add('rec');
  setStatus('listening… (auto-stops on silence)');
}

function stopRec() {
  if (!recording) return;
  recording = false;
  micBtn.classList.remove('rec');
  meterFill.style.width = '0%';
  const inputRate = ctx.sampleRate;
  const total = recChunks.reduce((n, c) => n + c.length, 0);
  const merged = new Float32Array(total);
  let off = 0;
  for (const c of recChunks) { merged.set(c, off); off += c.length; }
  recChunks = [];
  node.disconnect(); ctx.close();
  stream.getTracks().forEach(t => t.stop());
  const secs = total / inputRate;
  if (secs < 0.4) { setStatus('too short — try again'); return; }
  // linear resample to 16kHz
  const ratio = 16000 / inputRate;
  const outLen = Math.floor(total * ratio);
  const out = new Float32Array(outLen);
  for (let i = 0; i < outLen; i++) {
    const pos = i / ratio, i0 = Math.floor(pos), i1 = Math.min(i0 + 1, total - 1);
    out[i] = merged[i0] + (merged[i1] - merged[i0]) * (pos - i0);
  }
  const wav = encodeWav(out);
  setStatus(`heard ${secs.toFixed(1)}s — thinking…`);
  sendAudio(b64encode(wav));
}

async function sendAudio(b64) {
  busy = true; micBtn.disabled = true;
  try {
    const r = await fetch('/api/talk', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ audio: b64, session: sessionId }),
    });
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    addMsg('you', d.transcript);
    addMsg('hermes', d.reply, d.audio);
    setStatus('tap the mic or type below');
  } catch (err) {
    setStatus('⚠ ' + err.message);
  } finally {
    busy = false; micBtn.disabled = false;
  }
}

/* ---------- text fallback ---------- */
async function sendText() {
  const t = textEl.value.trim();
  if (!t || busy) return;
  textEl.value = '';
  busy = true;
  addMsg('you', t);
  setStatus('thinking…');
  try {
    const r = await fetch('/api/ask', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: t, session: sessionId }),
    });
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    addMsg('hermes', d.reply, d.audio);
    setStatus('tap the mic or type below');
  } catch (err) {
    setStatus('⚠ ' + err.message);
  } finally { busy = false; }
}
document.getElementById('send').addEventListener('click', sendText);
document.getElementById('newchat').addEventListener('click', newChat);
textEl.addEventListener('keydown', e => { if (e.key === 'Enter') sendText(); });
</script>
</body>
</html>
